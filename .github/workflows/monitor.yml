name: Obsadenosť plavárne
on:
  # Spúšťa cron-job.org každých 10 minút.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plavaren-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Overiť skript
        run: python -m unittest discover -s tests -v
      - name: Zmerať obsadenosť
        id: measure
        continue-on-error: true
        run: python monitor.py
      - name: Uložiť CSV do repozitára
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/occupancy.csv
          if ! git diff --cached --quiet; then
            git commit -m "Uložiť meranie obsadenosti"
            saved=false
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
                saved=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "Uloženie zlyhalo, opakujem pokus po prestávke."
                sleep "$((attempt * 15))"
              fi
            done
            if [ "$saved" != true ]; then
              echo "::error::CSV sa nepodarilo uložiť ani po 5 pokusoch; skontrolujte záložný artefakt."
              exit 1
            fi
          fi
      - name: Záložný CSV na stiahnutie
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occupancy-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/occupancy.csv
          retention-days: 30
          if-no-files-found: warn
      - name: Označiť neúspešné meranie
        if: steps.measure.outcome == 'failure'
        run: exit 1
